
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Course Recommendation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>AI Course Recommendation System</h1>
        <p>Find courses based on your interests!</p>

        <input type="text" id="username"
               placeholder="Enter your name">

        <h3>Select Your Interests</h3>

        <label><input type="checkbox" value="Python"> Python</label>
        <label><input type="checkbox" value="AI"> Artificial Intelligence</label>
        <label><input type="checkbox" value="ML"> Machine Learning</label>
        <label><input type="checkbox" value="Web"> Web Development</label>
        <label><input type="checkbox" value="Data"> Data Science</label>

        <button onclick="recommendCourses()">
            Recommend Courses
        </button>

        <div id="results"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
